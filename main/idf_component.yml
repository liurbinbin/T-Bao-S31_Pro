## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.1'
  espressif/esp-dl:
    path: ../components/esp-dl
  espressif/human_face_detect:
    path: ../components/human_face_detect
  jason-mao/av_processor: ^0.5.5
  espressif/gmf_ai_audio: ~0.8
  espressif/esp_video_codec: ~0.5
  78/xiaozhi-fonts: ~1.3.2
  # GIF-style emote player (.eaf animations exported from the Espressif emote
  # tool) + the memory-mapped asset bundle reader it consumes.
  espressif2022/esp_emote_expression: ^1.0.2
  espressif/esp_mmap_assets: ^1.3.2
  # Registry 0.1.0 only supports IDF <6; use in-tree 0.1.1 for IDF 6.x until published.
  espressif/esp_xiaozhi:
    path: ../components/esp_xiaozhi
  # Use the local wrapper so WebSocket task stacks stay in cache-safe internal
  # RAM while receive payloads use the fixed PSRAM pool.
  espressif/esp_websocket_client:
    version: ^1.8.0
    override_path: ../components/espressif__esp_websocket_client
  espressif/esp_lcd_st7796:
    version: ^1.4.0
    override_path: ../components/esp_lcd_st7796
  haqqscripter/esp_cam_io_parl:
    version: ^0.1.1
    override_path: ../components/haqqscripter__esp_cam_io_parl
  lambage/esp_lcd_touch_ft6336u: ^1.0.8
  sheldonix/esp_io_expander_xl9555: ^0.8.0
